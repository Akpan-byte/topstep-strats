# CHANGE_SUMMARY
# 2026-08-20  kilo
#   - Shared indicator math and session utilities for Paper-2 Rust engines.
# WHY: Avoid duplicating closed-bar indicator logic across 9 strategy cdylibs.

[package]
name = "paper2_indicators"
version = "0.1.0"
edition = "2021"

[lib]
name = "paper2_indicators"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
chrono-tz = "0.10"
engine_abi = { path = "../../../engine_abi" }
