# CHANGE_SUMMARY
# 2026-07-25  kilo
#   - Created topstep_parallel.yml to run the full 10-year NQ backtest across
#     20 date chunks and 2 strategies (40 parallel jobs).
#   - Each job downloads the 1-minute CSV via rclone from the akpanbrain remote
#     and uploads a small JSON artifact.
# 2026-07-25  kilo
#   - Switched data fetch from rclone to `gh release download` because the
#     rclone/S3 env vars in the runner did not match the Google Drive config.
#     The CSV is now attached to the `data-v1.0` release asset.
#   - A final aggregate job downloads all artifacts, combines them, and uploads
#     the final report + chart.
# 2026-08-03  coder
#   - Replaced the 2-strategy matrix with a 2-scenario Nitro CRT matrix
#     (first_only = one entry per session, reentries = all setups).
#   - Added --warmup-days 7 so each chunk sees prior HTF context; trades
#     outside the chunk are dropped to avoid double counting.
#   - Pinned strategy_params to htf_timeframe=5m / fixed_rr so the run
#     matches the validated backtest instead of the default 1h (which
#     produces a fake ~100% win rate).
#   - Fixed look-ahead bias in nitro_crt.py: entries now use the NEXT bar's
#     open instead of the signal bar's close.
# 2026-08-03  coder
#   - Added an instrument matrix dimension (NQ/ES/YM) so all three futures
#     are backtested. Each job fetches the matching <INSTR>_1min.csv from the
#     data-v1.0 release asset and passes --instrument so run_chunk.py applies
#     the correct tick_size and point_value ($20/$50/$5).
# 2026-08-03  coder
#   - REWRITTEN for the full HTF/target sweep. The matrix is now
#     instrument {NQ, ES} x htf {5m,15m,30m,1h,2h,4h} x target {fixed_rr,
#     opposite} x scenario {first_only, reentries} = 48 config-jobs; each job
#     runs scripts/run_sweep_job.py which loops all 20 overlapping chunks
#     in-process (7-day warmup, out-of-range signals dropped) so adjacent
#     chunks never skip or double-count a trade.
#   - Data now comes from the compressed parquet assets in the data-v2.0
#     release (~40MB/instrument vs ~190MB CSV), cutting download + parse time.
#   - YM is NOT in the GH matrix: the Akpan laptop runs the YM slice with
#     16 cores and uploads laptop_results.tar.gz to the data-v2.0 release;
#     the aggregate job merges it automatically so all 3 instruments land in
#     one final report.
#   - Aggregate emits by_config (instrument x htf x target x scenario) plus a
#     sweep_summary ranked by net points to settle which config is real.
# WHY: The sweep must decide between the documented 1h config and the
#      workflow's 5m pin across every timeframe and target mode, using all 20
#      GitHub Actions runners and the laptop in parallel, with compressed data
#      and a vectorized strategy to finish as fast as possible.

name: Nitro CRT HTF/Target Sweep

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instrument: [NQ, ES]
        htf: [5m, 15m, 30m, 1h, 2h, 4h]
        target_mode: [fixed_rr, opposite]
        scenario: [first_only, reentries]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch market data (parquet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/market_data
          gh release download data-v2.0 --repo ${{ github.repository }} --pattern '${{ matrix.instrument }}_1min.parquet' --dir /tmp/market_data/
          test -f /tmp/market_data/${{ matrix.instrument }}_1min.parquet

      - name: Run sweep config (20 overlapping chunks)
        env:
          NQ_DATA_PATH: /tmp/market_data/${{ matrix.instrument }}_1min.parquet
        run: |
          python scripts/run_sweep_job.py \
            --instrument ${{ matrix.instrument }} \
            --htf ${{ matrix.htf }} \
            --target-mode ${{ matrix.target_mode }} \
            --scenario ${{ matrix.scenario }} \
            --data-path /tmp/market_data/${{ matrix.instrument }}_1min.parquet \
            --output-dir results/${{ matrix.instrument }}/${{ matrix.htf }}/${{ matrix.target_mode }}/${{ matrix.scenario }} \
            --warmup-days 7

      - name: Upload config artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-${{ matrix.instrument }}-${{ matrix.htf }}-${{ matrix.target_mode }}-${{ matrix.scenario }}
          path: results/${{ matrix.instrument }}/${{ matrix.htf }}/${{ matrix.target_mode }}/${{ matrix.scenario }}/
          if-no-files-found: error

  aggregate:
    needs: sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all config artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: config-*
          merge-multiple: true

      - name: Merge laptop results (YM slice) if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp
          gh release download data-v2.0 --repo ${{ github.repository }} --pattern 'laptop_results.tar.gz' --dir /tmp/laptop_dl 2>/dev/null || echo "no laptop results yet"
          if test -f /tmp/laptop_dl/laptop_results.tar.gz; then
            tar -xzf /tmp/laptop_dl/laptop_results.tar.gz -C artifacts/
            echo "merged laptop results"
          fi

      - name: Aggregate results
        run: |
          python scripts/aggregate.py --input artifacts --output final_report

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: final_report/
          if-no-files-found: error
