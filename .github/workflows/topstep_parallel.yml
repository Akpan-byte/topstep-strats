# CHANGE_SUMMARY
# 2026-07-25  kilo
#   - Created topstep_parallel.yml to run the full 10-year NQ backtest across
#     20 date chunks and 2 strategies (40 parallel jobs).
#   - Each job downloads the 1-minute CSV via rclone from the akpanbrain remote
#     and uploads a small JSON artifact.
#   - A final aggregate job downloads all artifacts, combines them, and uploads
#     the final report + chart.
# WHY: GitHub Actions provides 20 free concurrent workers; splitting the
#      backtest by date keeps each job fast and artifact sizes small.

name: Topstep Parallel Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chunk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [kasen_orb, nitro_crt]
        chunk:
          # 20 chunks covering the available NQ 1-minute data (2016-06-01 to 2026-05-29).
          - {start: "2016-06-01", end: "2016-11-30"}
          - {start: "2016-12-01", end: "2017-05-31"}
          - {start: "2017-06-01", end: "2017-11-30"}
          - {start: "2017-12-01", end: "2018-05-31"}
          - {start: "2018-06-01", end: "2018-11-30"}
          - {start: "2018-12-01", end: "2019-05-31"}
          - {start: "2019-06-01", end: "2019-11-30"}
          - {start: "2019-12-01", end: "2020-05-31"}
          - {start: "2020-06-01", end: "2020-11-30"}
          - {start: "2020-12-01", end: "2021-05-31"}
          - {start: "2021-06-01", end: "2021-11-30"}
          - {start: "2021-12-01", end: "2022-05-31"}
          - {start: "2022-06-01", end: "2022-11-30"}
          - {start: "2022-12-01", end: "2023-05-31"}
          - {start: "2023-06-01", end: "2023-11-30"}
          - {start: "2023-12-01", end: "2024-05-31"}
          - {start: "2024-06-01", end: "2024-11-30"}
          - {start: "2024-12-01", end: "2025-05-31"}
          - {start: "2025-06-01", end: "2025-11-30"}
          - {start: "2025-12-01", end: "2026-05-29"}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch NQ market data
        env:
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          RCLONE_CONFIG_AKPANBRAIN_TYPE: ${{ secrets.RCLONE_CONFIG_AKPANBRAIN_TYPE }}
          RCLONE_CONFIG_AKPANBRAIN_PROVIDER: ${{ secrets.RCLONE_CONFIG_AKPANBRAIN_PROVIDER }}
          RCLONE_CONFIG_AKPANBRAIN_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_AKPANBRAIN_ACCESS_KEY_ID }}
          RCLONE_CONFIG_AKPANBRAIN_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_AKPANBRAIN_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_AKPANBRAIN_ENDPOINT: ${{ secrets.RCLONE_CONFIG_AKPANBRAIN_ENDPOINT }}
          RCLONE_CONFIG_AKPANBRAIN_REGION: ${{ secrets.RCLONE_CONFIG_AKPANBRAIN_REGION }}
        run: |
          mkdir -p /tmp/market_data
          if command -v rclone >/dev/null 2>&1 && [ -n "${RCLONE_CONFIG_AKPANBRAIN_TYPE:-}" ]; then
            rclone copy akpanbrain:data/market_data/NQ_1min.csv /tmp/market_data/ || echo "rclone failed, will try fallback URL"
          fi
          if [ ! -f /tmp/market_data/NQ_1min.csv ] && [ -n "${MARKET_DATA_URL:-}" ]; then
            curl -fsSL -o /tmp/market_data/NQ_1min.csv "${MARKET_DATA_URL}"
          fi
          test -f /tmp/market_data/NQ_1min.csv

      - name: Run backtest chunk
        env:
          NQ_DATA_PATH: /tmp/market_data/NQ_1min.csv
        run: |
          mkdir -p results
          python scripts/run_chunk.py \
            --strategy ${{ matrix.strategy }} \
            --start-date ${{ matrix.chunk.start }} \
            --end-date ${{ matrix.chunk.end }} \
            --output results/result_${{ matrix.strategy }}_${{ matrix.chunk.start }}_${{ matrix.chunk.end }}.json

      - name: Upload chunk result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.strategy }}-${{ matrix.chunk.start }}-${{ matrix.chunk.end }}
          path: results/result_${{ matrix.strategy }}_${{ matrix.chunk.start }}_${{ matrix.chunk.end }}.json
          if-no-files-found: error

  aggregate:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: result-*
          merge-multiple: true

      - name: Aggregate results
        run: |
          python scripts/aggregate.py --input artifacts --output final_report

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: final_report/
          if-no-files-found: error
