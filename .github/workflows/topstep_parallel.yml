# CHANGE_SUMMARY
# 2026-07-25  kilo
#   - Created topstep_parallel.yml to run the full 10-year NQ backtest across
#     20 date chunks and 2 strategies (40 parallel jobs).
#   - Each job downloads the 1-minute CSV via rclone from the akpanbrain remote
#     and uploads a small JSON artifact.
# 2026-07-25  kilo
#   - Switched data fetch from rclone to `gh release download` because the
#     rclone/S3 env vars in the runner did not match the Google Drive config.
#     The CSV is now attached to the `data-v1.0` release asset.
#   - A final aggregate job downloads all artifacts, combines them, and uploads
#     the final report + chart.
# 2026-08-03  coder
#   - Replaced the 2-strategy matrix with a 2-scenario Nitro CRT matrix
#     (first_only = one entry per session, reentries = all setups).
#   - Added --warmup-days 7 so each chunk sees prior HTF context; trades
#     outside the chunk are dropped to avoid double counting.
#   - Pinned strategy_params to htf_timeframe=5m / fixed_rr so the run
#     matches the validated backtest instead of the default 1h (which
#     produces a fake ~100% win rate).
#   - Fixed look-ahead bias in nitro_crt.py: entries now use the NEXT bar's
#     open instead of the signal bar's close.
# 2026-08-03  coder
#   - Added an instrument matrix dimension (NQ/ES/YM) so all three futures
#     are backtested. Each job fetches the matching <INSTR>_1min.csv from the
#     data-v1.0 release asset and passes --instrument so run_chunk.py applies
#     the correct tick_size and point_value ($20/$50/$5).
# WHY: The live bot trades 5m CRT with reentries; the backtest must use the
#      same config and a realistic fill price to validate it correctly, and
#      the portfolio now spans NQ, ES, and YM.

name: Topstep Parallel Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chunk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instrument: [NQ, ES, YM]
        scenario: [first_only, reentries]
        chunk:
          # 20 chunks covering the available 1-minute data (2016-06-01 to 2026-05-29).
          - {start: "2016-06-01", end: "2016-11-30"}
          - {start: "2016-12-01", end: "2017-05-31"}
          - {start: "2017-06-01", end: "2017-11-30"}
          - {start: "2017-12-01", end: "2018-05-31"}
          - {start: "2018-06-01", end: "2018-11-30"}
          - {start: "2018-12-01", end: "2019-05-31"}
          - {start: "2019-06-01", end: "2019-11-30"}
          - {start: "2019-12-01", end: "2020-05-31"}
          - {start: "2020-06-01", end: "2020-11-30"}
          - {start: "2020-12-01", end: "2021-05-31"}
          - {start: "2021-06-01", end: "2021-11-30"}
          - {start: "2021-12-01", end: "2022-05-31"}
          - {start: "2022-06-01", end: "2022-11-30"}
          - {start: "2022-12-01", end: "2023-05-31"}
          - {start: "2023-06-01", end: "2023-11-30"}
          - {start: "2023-12-01", end: "2024-05-31"}
          - {start: "2024-06-01", end: "2024-11-30"}
          - {start: "2024-12-01", end: "2025-05-31"}
          - {start: "2025-06-01", end: "2025-11-30"}
          - {start: "2025-12-01", end: "2026-05-29"}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch market data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/market_data
          gh release download data-v1.0 --repo ${{ github.repository }} --pattern '${{ matrix.instrument }}_1min.csv' --dir /tmp/market_data/
          test -f /tmp/market_data/${{ matrix.instrument }}_1min.csv

      - name: Run backtest chunk
        env:
          NQ_DATA_PATH: /tmp/market_data/${{ matrix.instrument }}_1min.csv
        run: |
          mkdir -p results
          python scripts/run_chunk.py \
            --strategy nitro_crt \
            --instrument ${{ matrix.instrument }} \
            --scenario ${{ matrix.scenario }} \
            --warmup-days 7 \
            --start-date ${{ matrix.chunk.start }} \
            --end-date ${{ matrix.chunk.end }} \
            --params '{"strategy_params": {"htf_timeframe": "5m", "entry_timeframe": "1m", "risk_reward": 1.5, "buffer_ticks": 1, "target_mode": "fixed_rr", "session_only": true, "session_start": "09:30", "session_end": "16:00", "tz": "America/New_York"}}' \
            --output results/result_${{ matrix.instrument }}_${{ matrix.scenario }}_${{ matrix.chunk.start }}_${{ matrix.chunk.end }}.json

      - name: Upload chunk result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.instrument }}-${{ matrix.scenario }}-${{ matrix.chunk.start }}-${{ matrix.chunk.end }}
          path: results/result_${{ matrix.instrument }}_${{ matrix.scenario }}_${{ matrix.chunk.start }}_${{ matrix.chunk.end }}.json
          if-no-files-found: error

  aggregate:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: result-*
          merge-multiple: true

      - name: Aggregate results
        run: |
          python scripts/aggregate.py --input artifacts --output final_report

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: final_report/
          if-no-files-found: error
