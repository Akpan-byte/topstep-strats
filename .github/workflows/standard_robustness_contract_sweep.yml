name: Standard Robustness Contract Sweep

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: [50k_standard, 150k_standard]
        objective: [robustness, eval_1ctr, eval_2ctr, eval_3ctr, eval_4ctr, eval_5ctr]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies and maturin
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt maturin

      - name: Build and install Rust engine
        run: |
          cd engine_rust
          maturin build --release
          pip install target/wheels/*.whl

      - name: Fetch ES/NQ/YM market data (data-v2.0 parquet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download data-v2.0 --repo ${{ github.repository }} \
            --pattern 'ES_1min.parquet' \
            --pattern 'NQ_1min.parquet' \
            --pattern 'YM_1min.parquet' \
            --dir data/
          test -f data/NQ_1min.parquet
          test -f data/ES_1min.parquet
          test -f data/YM_1min.parquet

      - name: Run standard robustness + eval contract sweep cell
        env:
          TOPSTEP_DATA_DIR: ${{ github.workspace }}/data
        run: |
          python scripts/standard_robustness_contract_sweep.py \
            --account ${{ matrix.account }} \
            --objective ${{ matrix.objective }}

      - name: Upload partial report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.account }}-${{ matrix.objective }}-report
          path: standard_robustness_contract_sweep_report_${{ matrix.account }}_${{ matrix.objective }}.csv
          if-no-files-found: error

  aggregate:
    needs: sweep
    runs-on: ubuntu-latest
    steps:
      - name: Download partial reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-report"
          merge-multiple: true

      - name: Combine reports
        run: |
          files=(artifacts/standard_robustness_contract_sweep_report_*.csv)
          head -1 "${files[0]}" > standard_robustness_contract_sweep_report.csv
          for f in "${files[@]}"; do
            tail -n +2 "$f" >> standard_robustness_contract_sweep_report.csv
          done
          wc -l standard_robustness_contract_sweep_report.csv

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: standard-robustness-contract-sweep-report
          path: standard_robustness_contract_sweep_report.csv
          if-no-files-found: error
